  <script>
    // UI toggles — single page navigation
    const landing = document.getElementById('landing');
    const movies = document.getElementById('movies');
    const startBtn = document.getElementById('startBtn');
    const backBtn = document.getElementById('backBtn');
    const emailInput = document.getElementById('email');

    function showMovies() {
      // small email validation visual (optional)
      const email = emailInput.value.trim();
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailInput.classList.add('invalid');
        emailInput.focus();
        return;
      }
      emailInput.classList.remove('invalid');

      landing.classList.remove('active');
      landing.classList.add('hidden');
      movies.classList.add('active', 'enter');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showLanding() {
      movies.classList.remove('active', 'enter');
      movies.classList.add('hidden');
      landing.classList.remove('hidden');
      landing.classList.add('active', 'enter-back');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    startBtn.addEventListener('click', showMovies);
    backBtn.addEventListener('click', showLanding);

    // allow Enter key to trigger
    emailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') startBtn.click();
    });

    // small removal of invalid styling on input
    emailInput.addEventListener('input', () => emailInput.classList.remove('invalid'));
  </script>
